<section id="promo" style="padding:24px 0"><div class="wrap"><div class="card" style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--accent);color:var(--accent-ink);border:0">
<div><h2 style="font-size:24px;margin:0">{{ c.title }}</h2><p style="margin:6px 0 0;opacity:.85">{{ c.body }}</p></div>
{% if c.cta_text %}<a class="btn" href="#services" style="background:var(--accent-ink);color:var(--accent);border-color:transparent">{{ c.cta_text }}</a>{% endif %}</div></div></section>
