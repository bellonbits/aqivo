{% if staff %}<section id="team"><div class="wrap"><h2>{{ c.title }}</h2><p class="sub">{{ c.subtitle }}</p>
<div class="team">{% for m in staff %}<div class="member">{% if m.photo_url %}<img src="{{ m.photo_url }}" alt="{{ m.name }}" loading="lazy" width="120" height="120">{% else %}<span class="ini">{{ m.name[:1] }}</span>{% endif %}<b>{{ m.name }}</b>
{% if wa %}<a href="{{ wa }}&text={{ ('Hi ' ~ business.name ~ ', I would like to book with ' ~ m.name)|urlencode }}" data-track="WHATSAPP_CLICK" rel="noopener">Book with {{ m.name.split(' ')[0] }}</a>{% endif %}</div>{% endfor %}</div></div></section>{% endif %}
