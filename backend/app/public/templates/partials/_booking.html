<section id="booking"><div class="wrap two"><div><h2>{{ c.title }}</h2><p class="sub">{{ c.subtitle }}</p>
<form class="book" id="book-form" novalidate data-currency="{{ business.currency }}">
  <fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:700;font-size:14px;margin-bottom:6px">Service</legend>
  <div class="checks">{% for sv in services %}<label><input type="checkbox" name="service" value="{{ sv.id }}"> <span style="flex:1">{{ sv.name }} <small style="color:var(--muted)">· {{ sv.duration_minutes }} min</small></span> <strong>{{ sv.price|money(sv.currency) }}</strong></label>{% endfor %}</div></fieldset>
  <label>Date <input type="date" name="date" required></label>
  <div><div style="font-weight:700;font-size:14px;margin-bottom:6px">Time</div><div class="slots" id="slots" role="group" aria-live="polite"><span style="color:var(--muted);font-size:14px">Choose a service and date to see times.</span></div></div>
  <label>Your name <input name="name" autocomplete="name" required maxlength="120"></label>
  <label>Phone (WhatsApp) <input name="phone" type="tel" autocomplete="tel" inputmode="tel" required placeholder="0712 345 678"></label>
  <label>Notes (optional) <textarea name="notes" rows="2" maxlength="500"></textarea></label>
  <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
  <button class="btn primary" type="submit">Request booking</button>
  <div id="book-msg" role="status"></div>
</form></div>
<div class="card" style="align-self:start"><h3 style="font-size:22px;margin-bottom:12px">Opening hours</h3><div class="hrs">{% for h in hours %}<div><span>{{ h.day }}</span><span>{{ h.text }}</span></div>{% endfor %}</div></div></div></section>
