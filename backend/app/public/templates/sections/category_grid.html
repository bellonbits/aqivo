<section class="store-category-section sx-sec" id="categories" data-tab-panel="products">
  <div class="wrap store-category-wrap">
    <!-- Header Title (Clean, borderless, aligned with section) -->
    <div class="store-category-header">
      <h2 class="store-category-title">{{ c.title or 'Browse by category' }}</h2>
      {% if c.subtitle %}
      <p class="store-category-sub">{{ c.subtitle }}</p>
      {% endif %}
    </div>

    <!-- Category Icon Bubbles Row -->
    <div class="store-category-icon-row">
      {% for t in d.tiles %}
      {% set cname = t.name|lower %}
      <button type="button" class="store-cat-bubble-btn" data-cat="{{ t.id }}" aria-label="Category {{ t.name }}">
        <div class="store-cat-bubble-circle">
          {% if t.image %}
          <img src="{{ t.image }}" alt="{{ t.name }}" class="store-cat-circle-img" loading="lazy" width="64" height="64">
          {% elif t.icon and ('http://' in t.icon or 'https://' in t.icon or '/' in t.icon or '.' in t.icon) and not ('<' in t.icon or 'svg' in t.icon) %}
          <img src="{{ t.icon }}" alt="{{ t.name }}" class="store-cat-circle-img" loading="lazy" width="64" height="64">
          {% elif t.icon and ('<' in t.icon or 'svg' in t.icon) %}
          {{ t.icon|safe }}
          {% elif 'phone' in cname or 'tech' in cname or 'electric' in cname or 'gadget' in cname %}
          <svg class="lucide lucide-smartphone" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><line x1="12" x2="12.01" y1="18" y2="18"/></svg>
          {% elif 'shirt' in cname or 'cloth' in cname or 'fashion' in cname or 'wear' in cname or 'shoe' in cname or 'boutique' in cname %}
          <svg class="lucide lucide-shirt" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
          {% elif 'beauty' in cname or 'care' in cname or 'skin' in cname or 'health' in cname or 'hair' in cname %}
          <svg class="lucide lucide-sparkles" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L12 3z"/></svg>
          {% elif 'food' in cname or 'drink' in cname or 'grocery' in cname or 'eat' in cname or 'snack' in cname %}
          <svg class="lucide lucide-shopping-bag" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" x2="21" y1="6" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          {% elif 'home' in cname or 'decor' in cname or 'office' in cname or 'house' in cname or 'kitchen' in cname %}
          <svg class="lucide lucide-home" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          {% else %}
          <svg class="lucide lucide-tag" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l4.71-4.71c.94-.94.94-2.48 0-3.42L12 2Z"/><line x1="7" x2="7.01" y1="7" y2="7"/></svg>
          {% endif %}
        </div>
        <span class="store-cat-bubble-label">{{ t.name }}</span>
        {% if t.count is not none %}
        <span class="store-cat-bubble-count" style="font-size:11px;color:var(--store-ink-subtle,#9ca3af)">{{ t.count }} item{{ '' if t.count == 1 else 's' }}</span>
        {% endif %}
      </button>
      {% endfor %}
    </div>
  </div>
</section>
