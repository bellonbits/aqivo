{% from "sections/_m.html" import store_product_card with context %}
<section class="ecom-carousel-section sx-sec" id="services">
  <div class="wrap store-catalog-wrap">
    <div class="ecom-section-header flex-between">
      <div>
        <h2 class="ecom-section-title">{{ c.title or 'Featured Services' }}</h2>
        {% if c.subtitle %}
        <p class="ecom-section-sub">{{ c.subtitle }}</p>
        {% endif %}
      </div>
      <div class="ecom-carousel-controls">
        <button type="button" class="ecom-carousel-btn" data-carousel-prev aria-label="Previous services">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button type="button" class="ecom-carousel-btn" data-carousel-next aria-label="Next services">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>

    <div class="ecom-carousel-rail" tabindex="0" role="region" aria-label="{{ c.title or 'Featured Services' }}" data-carousel-rail>
      {% for it in d.cards %}
      <div class="ecom-carousel-item">
        {{ store_product_card(it, c.show_price, true) }}
      </div>
      {% endfor %}
    </div>
  </div>
</section>
