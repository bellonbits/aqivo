<aside class="ecom-announcement-bar" role="complementary" aria-label="Announcement">
  <div class="wrap ecom-announcement-wrap">
    {% if c.link %}
    <a class="ecom-announcement-link" href="{{ c.link }}">
      <span class="ecom-announcement-icon">✨</span>
      <span>{{ c.text }}</span>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
    {% else %}
    <div class="ecom-announcement-text">
      <span class="ecom-announcement-icon">✨</span>
      <span>{{ c.text }}</span>
    </div>
    {% endif %}
  </div>
</aside>
