<section class="sx-sec"><div class="wrap">{% if c.title %}<h2>{{ c.title }}</h2>{% endif %}
{% if d.video.kind == 'iframe' %}<iframe class="video" src="{{ d.video.src }}" title="{{ c.title or 'Video' }}" loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
{% else %}<video class="video" src="{{ d.video.src }}" controls preload="metadata" playsinline></video>{% endif %}
{% if c.caption %}<p class="sub" style="margin-top:10px">{{ c.caption }}</p>{% endif %}</div></section>
