<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Loading Details...</title>
  <script>
    (function () {
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var ref = document.referrer;
      if (ref && ref.indexOf(window.location.host) !== -1 && ref.indexOf('/ecomm-templates/') === -1) {
        var joiner = ref.indexOf('?') === -1 ? '?' : '&';
        var target = (ref.indexOf('id=') === -1 && search) ? (ref + joiner + search.replace(/^\?/, '')) : ref;
        window.location.replace(target);
        return;
      }
      window.location.replace('service.html' + search + hash);
    })();
  </script>
</head>
<body>
  <p>Loading details... <a href="service.html">Click here if not redirected</a>.</p>
</body>
</html>
